ht="500" fill="#64747F">Что обнаружено</text><rect x="232" y="484" width="827" height="94" rx="6" fill="#FFFFFF" opacity="1" stroke="#DDE3E7"/><text x="246" y="509.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#17252F">Посторонний шум при работе вентилятора. Требуется дополнительная диагностика.</text><text x="232" y="627.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="500" fill="#64747F">Что выполнено</text><rect x="232" y="639" width="827" height="80" rx="6" fill="#FFFFFF" opacity="1" stroke="#DDE3E7"/><text x="246" y="664.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#17252F">Осмотр оборудования; переключения не выполнялись.</text><rect x="232" y="774" width="243" height="40" rx="6" fill="#FFFFFF" opacity="1" stroke="#DDE3E7"/><text x="266.765625" y="797.5" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#17252F">Добавить фото или файл</text><text x="493" y="800.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#64747F">Необязательно</text><rect x="232" y="882" width="208" height="40" rx="6" fill="#FFFFFF" opacity="1" stroke="#DDE3E7"/><text x="315.1953125" y="905.5" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#17252F">Назад</text><rect x="658" y="882" width="401" height="40" rx="6" fill="#175CD3" opacity="1"/><text x="786.46875" y="905.5" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Завершить проверку</text><rect x="1107" y="252" width="461" height="374" rx="6" fill="#FFFFFF" opacity="1" stroke="#DDE3E7"/><text x="1131" y="290.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#17252F">Что получит диспетчер</text><text x="1131" y="329.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#17252F">• Итог осмотра</text><text x="1131" y="350.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#17252F">• Время проверки</text><text x="1131" y="371.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#17252F">• Описание обнаруженного</text><text x="1131" y="392.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#17252F">• Выполненные действия</text><text x="1131" y="413.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#17252F">• Приложенные материалы</text><text x="1131" y="510.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#64747F">Завершение проверки сохраняет отчёт. Предупреждение</text><text x="1131" y="529.5" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#64747F">остаётся доступным диспетчеру для решения.</text></svg>