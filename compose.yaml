services:
  # Empty, idempotent schema initialization. Demo rows are never seeded on start.
  db-init:
    image: postgres:16
    environment:
      PGHOST: postgres
      PGUSER: astra
      PGPASSWORD: astra
      PGDATABASE: astra
    volumes:
      - ./sql:/sql:ro,z
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -f /sql/schema/01_core_schema.sql
        psql -v ON_ERROR_STOP=1 -f /sql/indexes/01_ext_journal_sensor_time.sql
        psql -v ON_ERROR_STOP=1 -f /sql/indexes/02_astra_channels_catalog.sql
    depends_on:
      postgres:
        condition: service_healthy

  source-agent:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SOURCE_CACHE_PATH: /data/cache
      SOURCE_HOST_ROOT: ${ASTRA_SOURCE_DIR:-${ASTRA_PROJECT_DIR:-.}/DJKH_transport}
      SOURCE_MOUNT_ROOT: /data/source
    volumes:
      - ${ASTRA_SOURCE_DIR:-./DJKH_transport}:/data/source:ro,z
      - source_cache:/data/cache
    command: ["python", "-m", "source_agent.main"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: postgres:16
    # Docker's 64 MB /dev/shm is too small for parallel index builds of the import.
    shm_size: 1g

    environment:
      POSTGRES_DB: astra
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U astra -d astra"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile

    environment:
      ML_DATABASE_URL: postgresql+psycopg://astra:astra@postgres:5432/astra
      ML_FORECAST_WORKERS: ${FORECAST_WORKERS:-4}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"

    volumes:
      - ./ml:/app/ml:Z
      - ./data_pipeline:/opt/data_pipeline:ro,z

    command:
      [
        "python",
        "-m",
        "uvicorn",
        "ml.src.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9000",
        "--reload"
      ]

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      
    environment:
      DATABASE_URL: postgresql+psycopg://astra:astra@postgres:5432/astra
      
      SOURCE_AGENT_URL: http://source-agent:9100

      DATA_SOURCE: ${DATA_SOURCE:-postgres}
      ML_DATA_SOURCE: ${ML_DATA_SOURCE:-postgres}

      ML_SERVICE_URL: http://ml:9000
      FORECAST_WORKERS: ${FORECAST_WORKERS:-4}
      FORECAST_BATCH_SIZE: ${FORECAST_BATCH_SIZE:-256}
      DATASET_UPLOAD_DIR: /data/uploads
      # empty = available CPU cores (2..8)
      DATASET_BUILD_WORKERS: ${DATASET_BUILD_WORKERS:-}
      DATASET_WORK_MEM_MB: ${DATASET_WORK_MEM_MB:-128}
      DATASET_STORAGE_EXPANSION_FACTOR: ${DATASET_STORAGE_EXPANSION_FACTOR:-8}

    ports:
      # Docker selects a free loopback port; astra.sh prints the resulting URL.
      - "127.0.0.1::8000"

    volumes:
      - ./backend/app:/app/app:Z
      - ./backend/main.py:/app/main.py:Z
      - ./data_pipeline:/opt/data_pipeline:ro,z
      - ./data/uploads:/data/uploads:Z

    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    depends_on:
      db-init:
        condition: service_completed_successfully

      source-agent:
        condition: service_healthy

      postgres:
        condition: service_healthy

      ml:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend

    environment:
      # Browser requests stay on the frontend origin; Vite proxies /api to backend.
      VITE_API_URL: ""

    ports:
      # Docker selects a free loopback port; astra.sh opens the resulting URL.
      - "127.0.0.1::5173"

    volumes:
      - ./frontend/src:/app/src:Z

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20


volumes:
  postgres_data:
  source_cache:
