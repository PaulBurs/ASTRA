services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra
      POSTGRES_DB: astra
    ports:
      - "5432:5432"
    volumes:
      - astra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://astra:astra@postgres:5432/astra
      ML_DATA_SOURCE: dummy
    ports:
      - "8000:8000"

    volumes:
      - ./backend/app:/app/app:Z
      - ./backend/main.py:/app/main.py:Z

    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "5173:5173"

    volumes:
      - ./frontend/src:/app/src:Z

    depends_on:
      - backend

volumes:
  astra_postgres_data:
