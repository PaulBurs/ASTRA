services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: astra
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U astra -d astra"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  ml:
    build:
      context: ./ml

    environment:
      ML_DATABASE_URL: postgresql+psycopg://astra:astra@postgres:5432/astra

    ports:
      - "9000:9000"

    volumes:
      - ./ml:/app/ml:Z
      - ${SOURCE_DATA_PATH:-./data/demo}:/data/source:ro,Z

    command:
      [
        "python",
        "-m",
        "uvicorn",
        "ml.src.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9000",
        "--reload"
      ]

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  backend:
    build:
      context: ./backend
      
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      DATABASE_URL: postgresql+psycopg://astra:astra@postgres:5432/astra
      
      SOURCE_AGENT_URL: http://host.docker.internal:9100

      DATA_SOURCE: ${DATA_SOURCE:-postgres}
      ML_DATA_SOURCE: ${ML_DATA_SOURCE:-postgres}

      ML_SERVICE_URL: http://ml:9000

    ports:
      - "8000:8000"

    volumes:
      - ./backend/app:/app/app:Z
      - ./backend/main.py:/app/main.py:Z
      - source_cache:/data/cache

    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    depends_on:
      postgres:
        condition: service_healthy

      ml:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend

    environment:
      VITE_API_URL: http://127.0.0.1:8000

    ports:
      - "5173:5173"

    volumes:
      - ./frontend/src:/app/src:Z

    depends_on:
      backend:
        condition: service_healthy


volumes:
  postgres_data:
  source_cache:
